                    { q: "Las proteínas están compuestas por unidades estructurales básicas llamadas:", o: ["Monosacáridos.", "Ácidos grasos.", "Nucleótidos.", "Aminoácidos."], a: 3, h: "Existen 20 de ellos estándar en los seres vivos." },
                    { q: "En la genética mendeliana, el fenotipo es:", o: ["La constitución genética exacta (ej. Aa).", "La expresión física y observable del genotipo.", "El alelo recesivo oculto.", "El lugar que ocupa un gen en el cromosoma."], a: 1, h: "Lo que se puede ver o medir (color, tamaño)." },
                    { q: "El transporte activo a través de membrana se caracteriza por:", o: ["Mover sustancias a favor del gradiente sin usar energía.", "Mover sustancias en contra del gradiente requiriendo gasto de ATP.", "Solo transportar agua (ósmosis).", "Ser un proceso pasivo mediado por canales iónicos."], a: 1, h: "Funciona como una bomba que requiere combustible (ATP)." },
                    { q: "El ciclo de Krebs (ciclo del ácido cítrico) ocurre en:", o: ["El citoplasma celular.", "La membrana externa mitocondrial.", "La matriz mitocondrial.", "El estroma del cloroplasto."], a: 2, h: "Es el interior de la mitocondria." },
                    { q: "Una mutación 'silenciosa' o 'sinónima' en el ADN se define como aquella que:", o: ["Causa la muerte celular programada.", "Cambia la base nitrogenada pero NO altera la secuencia de aminoácidos de la proteína.", "Introduce un codón de parada prematuro.", "Inactiva todo el cromosoma."], a: 1, h: "Gracias a la redundancia del código genético, no se nota en la proteína." },
                    { q: "La estructura cuaternaria de una proteína se refiere a:", o: ["Su secuencia lineal de aminoácidos.", "Los plegamientos locales como alfa hélices.", "La conformación tridimensional completa de una sola cadena.", "La unión y ensamble de múltiples cadenas polipeptídicas (subunidades)."], a: 3, h: "Ejemplo clásico: la hemoglobina con sus 4 subunidades." },
                    { q: "En plantas vasculares, el tejido encargado de transportar agua y minerales desde la raíz a las hojas es el:", o: ["Floema.", "Xilema.", "Parénquima.", "Colénquima."], a: 1, h: "El otro transporta savia elaborada (azúcares)." },
                    { q: "La homeostasis se define como:", o: ["El crecimiento descontrolado de un tejido.", "La capacidad de un organismo de mantener sus condiciones internas estables.", "La reducción del ritmo metabólico en invierno (hibernación).", "El intercambio de gases en los alvéolos pulmonares."], a: 1, h: "Termorregulación, equilibrio de pH, etc." },
                    { q: "Los lípidos cumplen la función fisiológica principal de:", o: ["Catálisis enzimática rápida.", "Almacenamiento de información genética.", "Reserva de energía a largo plazo y formación de membranas.", "Transporte de oxígeno en sangre."], a: 2, h: "Grasas, aceites y fosfolípidos." },
                    { q: "La unión entre dos neuronas para transmitir el impulso nervioso mediante neurotransmisores se llama:", o: ["Sinapsis.", "Cruce quiasmático.", "Unión neuromuscular.", "Nódulo de Ranvier."], a: 0, h: "Es el espacio de comunicación química neuronal." },
                    { q: "El tipo de enlace químico fuerte que une a los aminoácidos para formar proteínas se denomina:", o: ["Enlace puente de hidrógeno.", "Enlace glucosídico.", "Enlace peptídico.", "Enlace fosfodiéster."], a: 2, h: "Une el grupo amino de uno con el carboxilo de otro." },
                    { q: "La apoptosis es:", o: ["La división incontrolada de células (cáncer).", "La muerte celular programada de forma natural y limpia.", "La destrucción celular por infección viral (lisis).", "La diferenciación de células madre en tejidos maduros."], a: 1, h: "Es el 'suicidio celular' ordenado que previene enfermedades." },
                    { q: "Un organismo heterocigoto para dos rasgos no ligados (AaBb) que se cruza con otro heterocigoto (AaBb) producirá una proporción fenotípica mendeliana clásica de:", o: ["9:3:3:1", "1:2:1", "3:1", "1:1:1:1"], a: 0, h: "Tercera ley de Mendel (Segregación independiente)." },
                    { q: "La hormona producida por el páncreas encargada de reducir los niveles de glucosa en sangre es la:", o: ["Adrenalina.", "Glucagón.", "Tiroxina.", "Insulina."], a: 3, h: "El glucagón hace lo contrario (eleva la glucosa)." },
                    { q: "La base nitrogenada Uracilo (U) en el ARN sustituye a cuál base del ADN:", o: ["Adenina (A).", "Timina (T).", "Citosina (C).", "Guanina (G)."], a: 1, h: "El par A se une con U en el ARN." },
                    { q: "En la inmunidad adaptativa humana, las células encargadas de producir anticuerpos son:", o: ["Macrófagos.", "Linfocitos T.", "Linfocitos B (células plasmáticas).", "Eritrocitos."], a: 2, h: "Los otros linfocitos (T) tienen función citotóxica o colaboradora." },
                    { q: "La estructura anatómica donde ocurre el principal intercambio de gases respiratorios en mamíferos son los:", o: ["Bronquios.", "Alvéolos.", "Traqueolas.", "Branquias."], a: 1, h: "Pequeños sacos de aire al final de los pulmones." },
                    { q: "El codón de inicio estándar en la traducción genética es AUG, que codifica para el aminoácido:", o: ["Triptófano.", "Glicina.", "Metionina.", "Cisteína."], a: 2, h: "Casi todas las proteínas empiezan con este aminoácido." }
                ]
            }
        ];

        let currentSectionIndex = 0;
        // Objeto para guardar las respuestas del usuario { sectionIndex: { questionIndex: selectedOptionIndex } }
        let userAnswers = { 0: {}, 1: {}, 2: {} };

        const appDiv = document.getElementById('app');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const sectionTitleProgress = document.getElementById('section-title-progress');

        function renderSection() {
            window.scrollTo(0,0);
            const sectionData = db[currentSectionIndex];
            const savedAnswers = userAnswers[currentSectionIndex];
            
            // Actualizar header progress
            const progressPercent = Math.round((currentSectionIndex / 3) * 100);
            progressBar.style.width = `${progressPercent}%`;
            progressText.innerText = `${progressPercent}%`;
            sectionTitleProgress.innerText = `Sección ${currentSectionIndex + 1} de 3`;

            let html = `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden fade-in">
                    <div class="bg-inst-900 text-white p-6 border-b-4 border-inst-primary">
                        <h2 class="text-2xl font-bold flex items-center gap-3">
                            <i class="fas ${sectionData.icon} text-inst-primary"></i> 
                            ${sectionData.section}
                        </h2>
                    </div>
                    <div class="p-6 md:p-10 space-y-12">
            `;

            sectionData.questions.forEach((q, qIndex) => {
                // Generar un número de pregunta global basado en la sección
                let globalQNum = qIndex + 1;
                if(currentSectionIndex === 1) globalQNum += db[0].questions.length;
                if(currentSectionIndex === 2) globalQNum += db[0].questions.length + db[1].questions.length;

                html += `
                    <div class="border-b border-slate-100 pb-8 last:border-0 last:pb-0" id="q-container-${qIndex}">
                        <div class="flex justify-between items-start gap-4 mb-5">
                            <h3 class="text-lg font-semibold text-slate-800 leading-snug">
                                <span class="text-inst-primary mr-1">${globalQNum}.</span> ${q.q}
                            </h3>
                            <button type="button" onclick="toggleHint(${currentSectionIndex}, ${qIndex})" class="shrink-0 flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium text-inst-accent bg-yellow-50 hover:bg-yellow-100 border border-yellow-200 rounded-lg transition-colors">
                                <i class="fas fa-lightbulb"></i> Apoyo
                            </button>
                        </div>
                        
                        <div id="hint-${currentSectionIndex}-${qIndex}" class="hidden mb-5 p-4 bg-yellow-50 border-l-4 border-inst-accent rounded-r-lg text-sm text-yellow-800">
                            <strong>Pista:</strong> ${q.h}
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                `;

                q.o.forEach((opt, optIndex) => {
                    const isChecked = savedAnswers[qIndex] === optIndex ? 'checked' : '';
                    html += `
                        <label class="relative cursor-pointer group">
                            <input type="radio" name="q-${currentSectionIndex}-${qIndex}" value="${optIndex}" class="peer sr-only option-radio" onchange="saveAnswer(${currentSectionIndex}, ${qIndex}, ${optIndex})" ${isChecked}>
                            <div class="w-full border-2 border-slate-200 rounded-xl p-4 transition-all duration-200 group-hover:border-inst-primary text-slate-700 bg-white">
                                <span class="font-medium text-slate-900 mr-2">${String.fromCharCode(65 + optIndex)})</span> 
                                ${opt}
                                <i class="fas fa-check-circle absolute top-4 right-4 text-inst-primary opacity-0 scale-50 transition-all duration-300 check-icon text-xl"></i>
                            </div>
                        </label>
                    `;
                });

                html += `</div></div>`;
            });

            // Botones de navegación de la sección
            html += `
                    </div>
                    <div class="bg-slate-50 border-t border-slate-200 p-6 flex justify-between items-center">
                        ${currentSectionIndex > 0 ? 
                            `<button onclick="prevSection()" class="px-6 py-2.5 rounded-lg border-2 border-slate-300 text-slate-600 font-medium hover:bg-slate-100 hover:border-slate-400 transition-colors">
                                <i class="fas fa-arrow-left mr-2"></i> Anterior
                            </button>` : '<div></div>'
                        }
                        
                        ${currentSectionIndex < 2 ?
                            `<button onclick="nextSection()" class="px-8 py-2.5 rounded-lg bg-inst-primary text-white font-medium hover:bg-sky-700 shadow-md transition-all">
                                Siguiente Sección <i class="fas fa-arrow-right ml-2"></i>
                            </button>` :
                            `<button onclick="finishTest()" class="px-8 py-2.5 rounded-lg bg-inst-900 text-white font-medium hover:bg-slate-800 shadow-md transition-all border-2 border-inst-accent">
                                Finalizar Simulación <i class="fas fa-flag-checkered ml-2"></i>
                            </button>`
                        }
                    </div>
                </div>
            `;
            
            appDiv.innerHTML = html;
        }

        function toggleHint(secIdx, qIdx) {
            const el = document.getElementById(`hint-${secIdx}-${qIdx}`);
            if(el.classList.contains('hidden')) {
                el.classList.remove('hidden');
                el.classList.add('fade-in');
            } else {
                el.classList.add('hidden');
            }
        }

        function saveAnswer(secIdx, qIdx, optIdx) {
            userAnswers[secIdx][qIdx] = optIdx;
        }

        function validateCurrentSection() {
            const sectionData = db[currentSectionIndex];
            const totalQuestions = sectionData.questions.length;
            const answeredQuestions = Object.keys(userAnswers[currentSectionIndex]).length;
            
            return totalQuestions === answeredQuestions;
        }

        function showAlert() {
            document.getElementById('alert-modal').classList.replace('hidden', 'flex');
        }

        function nextSection() {
            if(!validateCurrentSection()) {
                showAlert();
                return;
            }
            currentSectionIndex++;
            renderSection();
        }

        function prevSection() {
            currentSectionIndex--;
            renderSection();
        }

        function finishTest() {
            if(!validateCurrentSection()) {
                showAlert();
                return;
            }
            
            // Evaluar y mostrar resultados
            progressBar.style.width = '100%';
            progressText.innerText = '100%';
            sectionTitleProgress.innerText = "Simulación Completada";
            
            let totalCorrect = 0;
            let totalQuestions = 80; // 27+27+26
            
            let breakdownHtml = "";

            db.forEach((sec, secIdx) => {
                let secCorrect = 0;
                sec.questions.forEach((q, qIdx) => {
                    if(userAnswers[secIdx][qIdx] === q.a) {
                        secCorrect++;
                        totalCorrect++;
                    }
                });
                breakdownHtml += `
                    <div class="flex justify-between items-center py-3 border-b border-slate-100 last:border-0">
                        <span class="font-medium text-slate-700">${sec.section.split(' (')[0]}</span>
                        <span class="font-bold text-inst-primary">${secCorrect} / ${sec.questions.length}</span>
                    </div>
                `;
            });

            const scorePercent = Math.round((totalCorrect / totalQuestions) * 100);
            
            let resultMessage = "";
            let resultColor = "";
            let resultIcon = "";
            if(scorePercent >= 80) {
                resultMessage = "¡Excelente Desempeño! Nivel Sobresaliente.";
                resultColor = "text-green-600";
                resultIcon = "fa-trophy";
            } else if(scorePercent >= 60) {
                resultMessage = "Desempeño Satisfactorio. Continúa repasando.";
                resultColor = "text-inst-primary";
                resultIcon = "fa-thumbs-up";
            } else {
                resultMessage = "Aún no satisfactorio. Requiere estudio intensivo.";
                resultColor = "text-amber-600";
                resultIcon = "fa-book-reader";
            }

            const html = `
                <div class="bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden fade-in text-center max-w-2xl mx-auto">
                    <div class="bg-inst-900 text-white p-8">
                        <i class="fas ${resultIcon} text-5xl text-inst-accent mb-4"></i>
                        <h2 class="text-3xl font-bold">Resultados del Simulador</h2>
                    </div>
                    <div class="p-8">
                        <div class="mb-8">
                            <p class="text-slate-500 text-sm font-semibold uppercase tracking-wider mb-2">Puntaje Global</p>
                            <div class="text-6xl font-bold ${resultColor} mb-2">${totalCorrect} / 80</div>
                            <p class="text-lg font-medium text-slate-800">${resultMessage} (${scorePercent}%)</p>
                        </div>
                        
                        <div class="bg-slate-50 rounded-xl p-6 mb-8 text-left border border-slate-200">
                            <h3 class="font-bold text-slate-800 mb-4 border-b border-slate-200 pb-2">Desglose por Área Disciplinar</h3>
                            ${breakdownHtml}
                        </div>

                        <button onclick="location.reload()" class="bg-inst-900 text-white px-8 py-3 rounded-lg font-bold hover:bg-slate-800 transition-colors border-2 border-transparent hover:border-inst-accent">
                            <i class="fas fa-redo mr-2"></i> Realizar Nueva Evaluación
                        </button>
                    </div>
                </div>
            `;
            
            appDiv.innerHTML = html;
            window.scrollTo(0,0);
        }

        // Iniciar
        renderSection();
    </script>
</body>
</html>
